[package]
name = "oxide_watch"
description = "OxideWatch is a lightweight, low-overhead Rust CLI tool designed for precise process monitoring and sandboxing."
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
rustix = { version = "1.1.6", features = ["process", "event", "time", "pipe", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"